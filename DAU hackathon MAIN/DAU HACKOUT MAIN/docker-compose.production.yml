# GridTrade — Production Docker Compose
# Usage: docker compose -f docker-compose.production.yml up -d
#
# SECRETS: All sensitive values must be provided via environment variables or
# a .env file. Never hardcode credentials in this file.
# Required variables:
#   POSTGRES_PASSWORD, POSTGRES_USER, POSTGRES_DB
#   DATABASE_URL, REDIS_URL
#   JWT_SECRET
#   CORS_ORIGIN
#   AI_SERVICE_URL

name: gridtrade-production

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - gridtrade-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - gridtrade-internal
    # No external port exposure in production — services connect via internal network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - gridtrade-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - gridtrade-internal

  # ─── AI Service ───────────────────────────────────────────────────────────
  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - gridtrade-internal
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── API Server ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      AI_SERVICE_URL: http://ai:8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - gridtrade-internal
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Web Frontend ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: artifacts/gridtrade-web/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - gridtrade-internal
      - gridtrade-external
    deploy:
      resources:
        limits:
          memory: 128m

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  gridtrade-internal:
    driver: bridge
    internal: true   # No external internet access from internal services
  gridtrade-external:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  gridtrade-postgres:
    driver: local
  gridtrade-redis:
    driver: local
