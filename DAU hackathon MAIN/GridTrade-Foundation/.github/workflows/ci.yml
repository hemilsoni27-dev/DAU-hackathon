name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck — libs
        run: pnpm run typecheck:libs

      - name: Typecheck — api-server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck — gridtrade-web
        run: pnpm --filter @workspace/gridtrade-web run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter @workspace/api-server run test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/api-server/test-results/
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Build gridtrade-web
        run: pnpm --filter @workspace/gridtrade-web run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: gridtrade-web-dist
          path: artifacts/gridtrade-web/dist/
          retention-days: 1

      - name: Upload api dist
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist/
          retention-days: 1

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high severity)
        run: pnpm audit --audit-level=high
        continue-on-error: true  # Advisory: report but don't block on third-party issues

      - name: Check for secrets in .env files
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file found in repository — must not be committed"
            exit 1
          fi
          echo "OK: .env not committed"
